<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Superagent demo</title>
<style>
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 3rem auto;
    max-width: 34rem;
    color: #1c1c1e;
    line-height: 1.5;
  }
  h1 { font-size: 1.35rem; margin-bottom: 0.25rem; }
  p.sub { color: #6b6b70; margin-top: 0; }
  form { margin: 1.5rem 0; }
  label { display: block; font-size: 0.9rem; margin-bottom: 0.35rem; }
  input {
    width: 100%;
    padding: 0.5rem;
    border: 1px solid #c7c7cc;
    border-radius: 6px;
    font: inherit;
  }
  button {
    margin-top: 0.75rem;
    padding: 0.5rem 1.1rem;
    border: 0;
    border-radius: 6px;
    background: #1c1c1e;
    color: #fff;
    font: inherit;
    cursor: pointer;
  }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    font-size: 0.85rem;
    color: #6b6b70;
  }
  td, th {
    padding: 1px 6px;
    border-bottom: 1px solid #ececf0;
  }
</style>
</head>
<body>
  <h1>Superagent demo</h1>
  <p class="sub">A tiny page for testing one change at a time.</p>

  <form>
    <label for="email">Email address</label>
    <input id="email" type="email" placeholder="you@example.com">
    <button type="submit">Submitt</button>
  </form>

  <table>
    <thead>
      <tr><th>Name</th><th>Status</th></tr>
    </thead>
    <tbody>
      <tr><td>Alpha</td><td>Ready</td></tr>
      <tr><td>Beta</td><td>Pending</td></tr>
      <tr><td>Gamma</td><td>Ready</td></tr>
    </tbody>
  </table>
</body>
</html>
